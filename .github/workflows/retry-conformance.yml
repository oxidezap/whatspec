name: Retry conformance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cargo test -p wa-transform --example retry_audit
      - run: cargo run -p whatspec -- restore --from-lock generated/bundles.lock.json --out /tmp/retry-inputs
      - run: cargo run -p wa-transform --example retry_audit -- generated/bundles.lock.json /tmp/retry-inputs /tmp/retry-audit
      - run: node tests/retry/capture-gates.mjs
      - run: node tests/retry/oracle.mjs
      - run: node tests/retry/oracle.mjs /tmp/retry-audit/audit.json

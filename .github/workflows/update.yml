name: Update WhatsApp specs

# Regenerates generated/ from the live WhatsApp Web bundles and commits any diff.
# Manual for now; switch the schedule on for daily/weekly runs.
on:
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: "Accept a domain count drop below the committed manifest (only when an upstream removal is verified)"
        type: boolean
        default: false
  # schedule:
  #   - cron: "0 6 * * *"   # daily 06:00 UTC

permissions:
  contents: write

concurrency:
  group: update-specs
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Regenerate AND keep the exact fetched bundles, so the same set can be
      # archived to the durable store below (WhatsApp 404s old versions). `--wasm-out`
      # additionally resolves and keeps the client's wasm payloads; they are auxiliary
      # (no generated/ artifact depends on them), so a resolution failure degrades to
      # fewer payloads rather than failing the run.
      - name: Regenerate specs
        run: |
          ./scripts/update.sh --save-bundles "$RUNNER_TEMP/bundles" \
            --wasm-out "$RUNNER_TEMP/wasm" \
            ${{ inputs.allow_shrink && '--allow-shrink' || '' }}

      # Publish the exact input set as a Release asset (durable, WA-independent) and
      # commit generated/ + its bundles.lock.json together, so every committed
      # generated/ is reproducible from a pinned, retrievable set.
      - name: Publish bundle archive and commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain generated)" ]; then
            echo "No spec changes."
            exit 0
          fi
          ver=$(jq -r .waVersion generated/manifest.json)
          ./scripts/publish-bundles.sh "$RUNNER_TEMP/bundles"
          # The wasm archive is content-addressed with no version in its name, so an
          # unchanged payload set is a no-op re-upload of identical bytes.
          # Gate on this run's *result*, not on the directory existing: a run that resolves
          # nothing still creates and sweeps the directory (so a stale payload can't linger),
          # and the previous version's lock is deliberately left in place. Publishing then
          # would compare that old lock against an empty directory and fail the step,
          # blocking an otherwise valid JS update.
          if [ -f generated/wasm.lock.json ] \
             && [ -n "$(find "$RUNNER_TEMP/wasm" -name '*.wasm' -print -quit 2>/dev/null)" ] \
             && [ "$(jq -r .waVersion generated/wasm.lock.json)" = "$ver" ]; then
            ./scripts/publish-wasm.sh "$RUNNER_TEMP/wasm"
          else
            echo "no wasm resolved for ${ver} this run — skipping the wasm archive"
          fi
          git add generated
          git commit -m "chore: update WhatsApp specs to ${ver}"
          git push

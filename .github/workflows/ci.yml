name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Also lint with every feature on, so otherwise-gated code (the reserved
      # `generalized-stanza` model, the `schema` derives) can't silently rot.
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The JSON Schema derivation + envelope self-tests only build under the
      # `schema` feature, so run them explicitly.
      - name: Schema self-tests
        run: cargo test -p wa-ir --features schema

      # The IR is the contract shared with the future WASM/tsify layer: it must
      # stay free of native deps. This fails if oxc/ureq/regex ever leak in.
      - name: wa-ir is WASM-safe (serde-only)
        run: cargo check -p wa-ir --target wasm32-unknown-unknown

      # The browser `fetch` adapter must keep compiling to WASM with the native
      # (ureq) transport off — the path the web/tsify layer will use.
      - name: wa-fetch WASM adapter builds
        run: cargo check -p wa-fetch --no-default-features --target wasm32-unknown-unknown

      # The CLI must build fetch-free (offline `--bundles` workflow; keeps the
      # network transport optional rather than load-bearing).
      - name: whatspec builds without fetch
        run: cargo build -p whatspec --no-default-features

      # Enforce the C-free guarantee: rustls uses the pure-Rust RustCrypto
      # provider, so `ring`/`aws-lc`/`openssl-sys` must never enter the tree (a
      # ureq feature flip or a new dep could otherwise reintroduce a C/asm build).
      - name: C-free (no ring/aws-lc/openssl-sys)
        run: |
          tree=$(cargo tree --workspace --edges normal --all-features)
          if echo "$tree" | grep -Eiq '\b(ring|aws-lc-sys|aws-lc-rs|openssl-sys)\b'; then
            echo "::error::native crypto/C dependency detected in the tree"
            echo "$tree" | grep -Ei '\b(ring|aws-lc-sys|aws-lc-rs|openssl-sys)\b'
            exit 1
          fi
          echo "C-free OK"

      # Catch dependencies declared in a Cargo.toml but no longer used in code.
      - name: Install dependency checks
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2
        with:
          tool: cargo-shear@1.13.4,cargo-deny@0.20.2
      - name: Unused dependencies
        run: cargo shear
      - name: Dependency advisories
        run: cargo deny --locked --workspace --all-features check advisories

      # Drift guard: the committed `generated/*/index.json` must still conform to
      # the committed `generated/schema/*.json`. Network-free and deterministic.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate generated artifacts against schemas
        run: |
          pip install --quiet jsonschema
          python scripts/validate-schemas.py generated

      # The schemas check SHAPE; this checks that the document is usable. A
      # consumer generating code from the IR — in any language — has to trust
      # that an enum names its values, a byte pin matches its length, a union
      # has alternatives. Those are invariants JSON Schema cannot express, and
      # the counted states are held to a baseline so a constraint that starts
      # slipping through shows up as a rise rather than as silence.
      - name: Check IR internal consistency
        run: python scripts/lint-ir.py generated

  # Reproducibility gate: restore the *exact* bundle set generated/ was built from
  # (from the durable release store, verified against the committed lockfile) and
  # regenerate in --check mode. Proves every committed generated/ is byte-for-byte
  # reproducible from its pinned inputs — the guarantee the hermetic `check` job
  # can't make on its own. Kept separate because it needs the network; dormant
  # until the update workflow bootstraps the first bundles.lock.json.
  determinism:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Reproduce generated/ from the committed lock
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f generated/bundles.lock.json ]; then
            echo "no generated/bundles.lock.json yet — reproducibility gate is dormant"
            echo "until the update workflow publishes the first locked bundle set."
            exit 0
          fi
          ./scripts/regen.sh

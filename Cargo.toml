[workspace]
resolver = "2"
# Per-crate descriptions live in each crate's Cargo.toml `description` (kept here
# comment-free so the formatter can't misalign per-member notes).
members = [
    "crates/wa-abprops",
    "crates/wa-appstate",
    "crates/wa-codegen",
    "crates/wa-enums",
    "crates/wa-fetch",
    "crates/wa-ir",
    "crates/wa-mex",
    "crates/wa-notif",
    "crates/wa-oxc",
    "crates/wa-proto",
    "crates/wa-scan",
    "crates/wa-text",
    "crates/wa-tokens",
    "crates/wa-transform",
    "crates/wa-wam",
    "crates/whatspec",
]

[workspace.package]
edition = "2024"
# The crates use let-chains (`if let … && let …`), stabilized in Rust 1.88, so 1.85
# would not compile them — declare the real floor rather than an aspirational one.
rust-version = "1.88"
license = "MIT"
authors = ["João Lucas <jlucaso@hotmail.com>"]
repository = "https://github.com/oxidezap/whatspec"

[workspace.dependencies]
anyhow = "1"

# Bundle-archive (de)compression for `whatspec restore`. Pure-Rust only:
# flate2's `rust_backend` (miniz_oxide) keeps the C-free guarantee — no libz-sys.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"

# oxc (native JS parsing/AST) — tooling crates only, never the WASM build.
oxc_allocator = "0.133"
oxc_ast = "0.133"
oxc_ast_visit = "0.133"
oxc_parser = "0.133"
oxc_span = "0.133"
oxc_syntax = "0.133"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Dev-only: syntax-check the generated reference `.rs` so codegen changes can't
# silently emit invalid Rust (the generated tree isn't part of any compiled crate).
syn = { version = "2", features = ["full", "parsing"] }
wa-abprops = { path = "crates/wa-abprops" }
wa-appstate = { path = "crates/wa-appstate" }
wa-codegen = { path = "crates/wa-codegen" }
wa-enums = { path = "crates/wa-enums" }
wa-fetch = { path = "crates/wa-fetch" }
wa-ir = { path = "crates/wa-ir" }
wa-mex = { path = "crates/wa-mex" }
wa-notif = { path = "crates/wa-notif" }
wa-oxc = { path = "crates/wa-oxc" }
wa-proto = { path = "crates/wa-proto" }
wa-scan = { path = "crates/wa-scan" }
wa-text = { path = "crates/wa-text" }
wa-tokens = { path = "crates/wa-tokens" }
wa-transform = { path = "crates/wa-transform" }
wa-wam = { path = "crates/wa-wam" }

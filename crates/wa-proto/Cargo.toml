[package]
name = "wa-proto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Native tooling: oxc AST extraction of WhatsApp protobuf specs into a WAProto.proto. Not WASM-targeted."

[dependencies]
oxc_allocator = { workspace = true }
oxc_ast = { workspace = true }
oxc_ast_visit = { workspace = true }
wa-ir = { workspace = true }
wa-oxc = { workspace = true }
wa-transform = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
# Dev-only: a pure-Rust protoc that parses AND fully type-resolves the emitted
# `WAProto.proto`, so a broken extraction (dangling type ref, duplicate name, bad
# enum scoping) fails `cargo test` instead of being silently auto-committed. Kept a
# dev-dep of this native-only crate so it never enters the wasm/shipped surface, and
# it is C-free (no ring/aws-lc/openssl-sys) so the C-free CI guard still holds.
protox = "0.9"

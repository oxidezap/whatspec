[package]
name = "wa-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Content-addressed locks and restoration for WhatsApp Web JS and wasm captures."

[features]
default = ["restore"]
restore = ["capture-restore", "wa-fetch/native"]
# Capture validation and restoration with a caller-supplied HTTP transport.
capture-restore = ["dep:anyhow", "dep:flate2", "dep:lzma-rust2", "dep:tar", "dep:tempfile", "dep:url", "dep:wa-fetch"]

[dependencies]
anyhow = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
lzma-rust2 = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tar = { workspace = true, optional = true }
tempfile = { version = "3", optional = true }
url = { version = "2.5", optional = true }
wa-fetch = { workspace = true, default-features = false, optional = true }
wa-text = { workspace = true }

[dev-dependencies]
lzma-rs = "0.3"

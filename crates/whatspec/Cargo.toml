[package]
name = "whatspec"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Extract WhatsApp Web's protocol surface from its JS bundle into a language-neutral IR (+ reference Rust)."

[[bin]]
name = "whatspec"
path = "src/main.rs"

[features]
default = ["fetch"]
# Network fetch of bundles from web.whatsapp.com (pulls in wa-fetch's native
# HTTP/TLS stack) plus the `restore` command that pulls a locked bundle set from
# the durable release store. On by default. Build with --no-default-features to
# get a fetch-free binary that only processes local bundles via `--bundles <dir>`.
fetch = ["dep:wa-fetch", "dep:flate2", "dep:tar", "dep:lzma-rs"]

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wa-abprops = { workspace = true }
wa-appstate = { workspace = true }
wa-codegen = { workspace = true }
wa-enums = { workspace = true }
wa-fetch = { workspace = true, optional = true }
# `restore` only: pull + unpack the durable bundle archive. Gated by `fetch`.
# flate2 reads legacy `.tar.gz`; lzma-rs reads (and decompresses) the current `.tar.xz`.
flate2 = { workspace = true, optional = true }
lzma-rs = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
wa-ir = { workspace = true, features = ["schema"] }
wa-mex = { workspace = true }
wa-notif = { workspace = true }
wa-proto = { workspace = true }
wa-scan = { workspace = true }
# Pure-Rust content hashing (sha256_hex) for the manifest — no C, always available.
wa-text = { workspace = true }
wa-tokens = { workspace = true }
wa-transform = { workspace = true }
wa-wam = { workspace = true }
wa-wasm = { workspace = true }
